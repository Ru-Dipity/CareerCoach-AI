apiVersion: apps/v1
kind: Deployment
metadata:
  name: careercoach-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: careercoach-app
  template:
    metadata:
      labels:
        app: careercoach-app
    spec:
      containers:
      - name: careercoach-app
        image: ruhuang1107/careercoach-ai:v9
        ports:
        - containerPort: 8501
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: groq-api-secret
              key: GROQ_API_KEY
